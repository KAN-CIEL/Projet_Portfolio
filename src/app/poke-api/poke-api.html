<main>
    <h1 class="text-3x1 font-bold underline">
        poke-api works!
    </h1>

    <form class="formulaire" [formGroup]="pokemonForm" (ngSubmit)="onSubmit()">
        <label for="pokemon-name" class="text-purple-600">Nom du pokemon</label>
        <input name="pokemon-name" formControlName="pokemonName" class="Input" />
        <button type="submit">Rechercher</button>
    </form>
    <div *ngIf="pokemonData">
        <app-pokemon-view [pokemon]="pokemonData"></app-pokemon-view>
    </div>
    <div *ngIf="pokemonNotExist">
        <p>Pokemon {{ pokemonForm.value.pokemonName }} non trouvé</p>
    </div>
    
</main>
